---
name: Tests

on:
  # issues/ だけの push では走らせない (2026-10-07〜21 の master は 1024 commit 中 497 件がそれで、Tests は 6〜10 分、
  # Lint は 1.5〜3 分かかっていた)。issues/ の中身で結果が変わるのは tests/issues/ の repo の状態を見る検査
  # (と、それを hook 経由で回す tests/githooks/test_pre_push.sh) だけで、そちらは issues.yml が回す。
  # issues/ の .md 以外のファイルは repo 全体を走査する検査 (test_enumerations_are_derived.sh の shell script の発見 等) に
  # 入るので、issues.yml が「issues/ は .md・.keep・audit-log だけ」を確かめて、その形を issues/ だけの push に入れさせない。
  # docs/ は外さない: issue の本文が docs/ を相対で指しており、docs/ を動かす push では tests/issues/ のリンクの検査が要る。
  # 検出しない形: paths filter は差分の先頭 300 ファイルしか見ない (GitHub の仕様)。issues/ を 300 件超動かす push に
  # issues/ の外の変更を混ぜると、ここが起動しないことがある (2026-10-21 時点で直近 3000 commit に 300 ファイル超は 0 件)。
  # そういう移動は別の push にする
  push:
    branches: [master]
    paths-ignore:
      - 'issues/**'
  pull_request:
    paths-ignore:
      - 'issues/**'
  workflow_dispatch:  # GitHub UI からの手動再実行 (flake 切り分け用)
  # push が数分おきに続くと、push の run は下の cancel-in-progress で次の push に取り消され続け、完走する run が途切れる
  # (2026-10-29 に約 2 時間)。1 時間ごとに master の最新を 1 本、push と別の group で走らせる。最新の commit を本体の job が
  # 既に検証していれば、本体は走らせずにその結果を引き継ぐ (schedule-gate)。検証したい commit を含むかは祖先で見る
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

# git init の hint 抑制 (init.defaultBranch)。env で注入する理由は _go-project.yml 参照。
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
# schedule の run は push と別の group にする: 同じ group だと次の push に取り消され、schedule を足した意味が無い
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'push' }}
  cancel-in-progress: true

jobs:
  # schedule の run だけ: master の最新の commit に、本体の job が走って結果を出した run があれば本体を走らせず、その結果を引き継ぐ
  schedule-gate:
    if: github.event_name == 'schedule'
    runs-on: xcode-27
    timeout-minutes: 5
    permissions:
      actions: write  # 検証済みで赤の commit で、gate だけの run を取り消す
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci_schedule_gate.sh tests.yml "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      # 検証済みで赤の commit なら、gate だけの run は取り消して終える。緑で終えると新しい順で run を選ぶ bin/ci-log -i に赤を隠し、
      # 赤で終えると push が無い間に赤い run が毎時積み重なり (通知も毎時)、push の run を re-run で緑にしても赤が残る。
      # 取り消しは非同期なので待ち、届かなければ赤で終える (緑には倒さない)
      - if: steps.gate.outputs.prior == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel "${{ github.run_id }}" -R "${{ github.repository }}"
          sleep 120
          echo "::error::前の run で赤の commit。gate だけの run の取り消しが届かなかった" && exit 1

  # 実行時間短縮のため 2 グループに並列分割し、heavy はジョブ内でも xargs -P 並列
  # (Makefile の run_tests_parallel)。テスト増殖で heavy が 5.6 分に育った実測 (2026-07-20)
  # を受けての措置。
  # グループ定義 (どのディレクトリが heavy か) は Makefile 側に集約 (CI_HEAVY_TEST_DIRS)。
  # rest は除外方式なので新テストディレクトリは自動で rest 側で走る。
  dotfiles-tests:
    needs: schedule-gate
    # push では schedule-gate は skip になる。!cancelled() が無いと、skip した needs に引きずられて本体も skip される。
    # 'false' でないなら走らせる: gate の job が落ちて出力が空のときも本体を走らせる (検証を飛ばすより安い)
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.schedule-gate.outputs.run != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # heavy (av1ify/concat) は nvim テストを含まない (setup-nvim 省略)。
          # 🚨 必要なコマンドをここに書かないこと: グループ定義 (CI_HEAVY_TEST_DIRS) の出典が
          # Makefile なのに依存だけ workflow にあると、heavy に bats/tmux 依存のテストを足した
          # とき「Makefile だけ直して CI が command not found で落ちる」まで気づけない。依存も Makefile の CI_COMMANDS_* が出典で、下の step が読む。
          - group: heavy
            make-target: test-discovered-heavy
            needs-nvim: false
            needs-go: true   # concat の診断のテストが bin/mp4-effective-size (Go) をビルドする (issue 670)
          - group: rest
            make-target: test-runtime-rest
            needs-nvim: true
            needs-go: true
    name: dotfiles-tests (${{ matrix.group }})
    # 対象は macOS のみ。Linux はサポート対象外なので CI もそちらへ揃える。
    # 🚨 `macos-latest` にしない。同じ commit の setup-nvim が「stable にせず明示 pin する
    #    (更新をファイルの変更として可視化する)」と書いているのと同じ理由で、ラベルの移動で
    #    誰の commit も無しに環境が変わるのを避ける。**開発機に合わせて macOS 27 に置く**
    #    (mount/ps/stat の出力差は移行の根拠そのものなので、ここがズレると逆向きの「CI だけ緑」を作る)。
    #    macOS 27 には `macos-27` ラベルが無く、GitHub は Xcode の major ごとの `xcode-27` で出している
    #    (2026-10-15 GA)。このラベルは Xcode の版に紐づき OS には紐づかない (preview 中に macOS 26 → 27 へ
    #    動いた)。開発機の OS を上げたら、対応する `xcode-NN` が載せている macOS を確かめて揃え直す。
    runs-on: xcode-27
    # macOS runner は VM 起動が遅く、実行自体も ubuntu より遅い。ubuntu 時代の 10 分では
    # 足りない可能性があるので広げる (実測して詰めること)。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 依存の出典は Makefile の CI_COMMANDS_<GROUP>。🚨 ここで `make -s ci-commands-*` は
      # 使わない (依存を解決する時点で make があるとは限らない)。Makefile の生の行を sed で読む。
      # 空を後段に流すと「何も入らないまま成功」になるため、読めなければ明示的に落とす。
      - name: Resolve required commands from Makefile (${{ matrix.group }})
        id: deps
        run: |
          var="CI_COMMANDS_$(printf '%s' '${{ matrix.group }}' | tr '[:lower:]' '[:upper:]')"
          cmds=$(sed -n "s/^${var}[[:space:]]*:=[[:space:]]*//p" Makefile)
          if [ -z "$cmds" ]; then
            echo "::error::Makefile から $var を読めなかった (変数名の変更 / 書式変更)"
            exit 1
          fi
          echo "commands=$cmds" >> "$GITHUB_OUTPUT"
          echo "$var = $cmds"

      # 導入と検証は共有 action に集約。formula 名の写像もあちら側にある。
      - uses: ./.github/actions/ensure-toolchain
        with:
          commands: ${{ steps.deps.outputs.commands }}

      # Neovim 0.12 pin + plugin cache + lazy restore。pin の理由・cache key の世代管理は
      # action 側に集約 (bench.yml と共有。二重管理を防ぐため詳細はそちらだけに書く)
      - uses: ./.github/actions/setup-nvim
        if: ${{ matrix.needs-nvim }}

      # rest の腕には Go を入れる。無いと Go で bin/ の道具をビルドするテストが丸ごと skip (77) になり、
      # そのうち tests/bin/test_go_autobuild_warmup.sh と tests/scripts/test_pull_main_checkout.sh は
      # 別のどの workflow でも走っていなかった (2026-10-01 の run 36876647960 で skip 8 件。残り 6 件のうち 5 件は
      # src_pro-con.yml の e2e と src_glogx.yml が走らせ、1 件は setup.sh 前提なので skip が正しい)。
      - uses: actions/setup-go@v7
        if: ${{ matrix.needs-go }}
        with:
          go-version-file: .github/go-version # CI の Go の版の正本 (go.mod の go 行は最小の版で、別に持つ)
          cache-dependency-path: src/*/go.sum

      - name: Run dotfiles test suite (${{ matrix.group }})
        env:
          DOTFILES_TS_SKIP_ENSURE: "1"
        run: make ${{ matrix.make-target }}
