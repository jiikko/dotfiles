---
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:  # GitHub UI からの手動再実行 (flake 切り分け用)

permissions:
  contents: read

# git init の hint 抑制 (init.defaultBranch)。env で注入する理由は _go-project.yml 参照。
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 実行時間短縮のため 2 グループに並列分割し、heavy はジョブ内でも xargs -P 並列
  # (Makefile の run_tests_parallel)。テスト増殖で heavy が 5.6 分に育った実測 (2026-07-20)
  # を受けての措置。
  # グループ定義 (どのディレクトリが heavy か) は Makefile 側に集約 (CI_HEAVY_TEST_DIRS)。
  # rest は除外方式なので新テストディレクトリは自動で rest 側で走る。
  dotfiles-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # heavy (av1ify/concat) は nvim テストを含まない (setup-nvim 省略)。
          # ⚠️ apt パッケージをここに書かないこと: グループ定義 (CI_HEAVY_TEST_DIRS) の出典が
          # Makefile なのに依存だけ workflow にあると、heavy に bats/tmux 依存のテストを足した
          # とき「Makefile だけ直して CI が command not found で落ちる」まで気づけない
          # (issue 073)。依存も Makefile の CI_PACKAGES_* が出典で、下の step が読む。
          - group: heavy
            make-target: test-discovered-heavy
            needs-nvim: false
          - group: rest
            make-target: test-runtime-rest
            needs-nvim: true
    name: dotfiles-tests (${{ matrix.group }})
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 依存の出典は Makefile の CI_PACKAGES_<GROUP>。⚠️ make 自体が apt の対象なので
      # `make -s ci-packages-*` はここでは使えない (この時点で未インストールの可能性)。sed で読む。
      # 空を install に流すと「何も入らないまま成功」になるため、読めなければ明示的に落とす。
      - name: Resolve runtime dependencies from Makefile (${{ matrix.group }})
        id: deps
        run: |
          var="CI_PACKAGES_$(printf '%s' '${{ matrix.group }}' | tr '[:lower:]' '[:upper:]')"
          pkgs=$(sed -n "s/^${var}[[:space:]]*:=[[:space:]]*//p" Makefile)
          if [ -z "$pkgs" ]; then
            echo "::error::Makefile から $var を読めなかった (変数名の変更 / 書式変更)"
            exit 1
          fi
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "$var = $pkgs"

      # ⚠️ ${{ }} を run: の中に直接埋めないこと。Makefile 由来の値がシェルとして評価される
      # (実測: CI_PACKAGES_HEAVY := $(OTHER) と書くと sed が生テキストを掴み、run: 側で
      # コマンド置換として実行されてパッケージ 0 個になる)。env 経由で受け、許可文字だけを通す。
      # $PKGS は複数パッケージへ分割させるため意図的に無引用。文字種の検証がその安全弁。
      - name: Install runtime dependencies (${{ steps.deps.outputs.packages }})
        env:
          DEBIAN_FRONTEND: noninteractive
          PKGS: ${{ steps.deps.outputs.packages }}
        run: |
          case "$PKGS" in
            *[!a-z0-9.+_\ -]*)
              echo "::error::パッケージ名に想定外の文字がある: [$PKGS]"
              exit 1
              ;;
          esac
          sudo apt-get update
          # shellcheck disable=SC2086 # 複数パッケージへ分割させる意図 (文字種は上で検証済み)
          sudo apt-get install -y --no-install-recommends $PKGS

      # Neovim 0.12 pin + plugin cache + lazy restore。pin の理由・cache key の世代管理は
      # action 側に集約 (bench.yml と共有。二重管理を防ぐため詳細はそちらだけに書く)
      - uses: ./.github/actions/setup-nvim
        if: ${{ matrix.needs-nvim }}

      - name: Run dotfiles test suite (${{ matrix.group }})
        env:
          DOTFILES_TS_SKIP_ENSURE: "1"
        run: make ${{ matrix.make-target }}
