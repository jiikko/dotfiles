---
# nvim / zsh / tmux / glogx のレイテンシベンチ (予算ゲート)。Tests から分離した workflow (2026-07-16):
# 「コードが壊れた」(Tests 赤) と「遅くなった / 予算の追従漏れ」(Bench 赤) は対処も緊急度も
# 違うのに同じ check に混ざっていた。実害 = 意図した機能追加 (点火アニメ) の予算追従漏れで
# master の Tests が赤になり機能破壊と区別できず (1f37fa1)。また bench は共有 runner の
# ノイズで flake し得るため、テストを再実行せず bench だけ単独で再実行できる必要がある。
# nvim の setup (pin/cache/restore) は tests.yml と共有の composite action に一元化。
# 各 job の「複数回実行 → 統計集約 → 直近 run プールとの比較つき Step Summary → 予算チェック」は
# tests/run_bench.sh に一元化 (実行回数は同スクリプトの BENCH_RUNS が出典)。
name: Bench

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:  # GitHub UI からの手動再実行 (flake 切り分け用)

permissions:
  contents: read

# git init の hint 抑制 (init.defaultBranch)。env で注入する理由は _go-project.yml 参照。
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # nvim と tmux は独立 job: 並列実行 + 片方だけの再実行が可能で、
  # tmux 側は重い nvim setup (plugin restore) を持たずに済む。
  #
  # さらなる並列化 (matrix shard) は検討済み見送り (2026-07-29):
  # - job 内の BENCH_RUNS=20 は意図的に直列。同一 runner 上で並列に走らせると計測同士が
  #   CPU を奪い合い、レイテンシ計測そのものを汚染する (ここを並列化してはいけない)
  # - shard 化 (例: 4 shard × 5 run + artifacts 集約 job) なら壁時計は縮むが、shard ごとの
  #   setup 重複で runner-minutes は増え、artifact/集約の配管が要る。現状の最長 job
  #   (tmux ~3.5 分) は非ブロッキング workflow の watch 遅延にしかならず、割に合わない
  # - 再評価の閾値: 最長 job が 10 分を超えたら shard 化を実装する
  bench-nvim:
    runs-on: ubuntu-slim
    timeout-minutes: 30  # BENCH_RUNS=20 (run_bench.sh 既定): 1 run ~40-60s 実測 + setup
    steps:
      - uses: actions/checkout@v7

      # bench_nvim.sh は zsh スクリプト (#!/usr/bin/env zsh)
      - name: Install runtime dependencies (zsh)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - uses: ./.github/actions/setup-nvim

      # 予算 (bench_budgets.ci) 超過で fail。予算は原則ローカル実測の ~4 倍の粗い上限 = 桁級の
      # 回帰 (foldexpr の 678ms 級) を捕まえる安全網で、微差の追跡は Step Summary の経時比較。
      # 例外: startup は min-of-5 集約 + CI 実測ベースの「現在速度」ゲート (bench_budgets.ci 参照)。
      # 注: CI は treesitter parser 未導入 (DOTFILES_TS_SKIP_ENSURE=1) のため fold/highlight の
      # コストは載らない。それらを含む実測はローカルで tests/nvim/bench_nvim.sh を叩く。
      # baseline のサンプル台帳 (Step Summary 比較テーブルの before 側)。直前 1 run でなく
      # 直近数 run をプールして比較する (保持 run 数は bench_stats.sh の BASELINE_RUNS が出典)。
      # save は green run のみ (下の Save step の if) なので、赤 run が比較基準を汚さない
      - name: Restore previous bench stats
        uses: actions/cache/restore@v6
        with:
          path: .bench-prev
          key: bench-prev-nvim-${{ github.run_id }}
          restore-keys: bench-prev-nvim-

      - name: Bench nvim latency (budget check)
        env:
          DOTFILES_TS_SKIP_ENSURE: "1"
          BENCH_PREV_FILE: .bench-prev/nvim.tsv
          BENCH_STATS_OUT: .bench-prev/nvim.tsv
        run: mkdir -p .bench-prev && tests/run_bench.sh nvim tests/nvim/bench_nvim.sh tests/nvim/bench_budgets.ci

      - name: Save bench stats for next run
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .bench-prev
          key: bench-prev-nvim-${{ github.run_id }}

  bench-zsh:
    runs-on: ubuntu-slim
    timeout-minutes: 20  # BENCH_RUNS=20: 1 run ~20s 実測
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime dependencies (zsh)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      # GHA runner は zsh の system fpath (/usr/share/zsh 等) が group-writable なため、対話シェルの
      # compinit が「Ignore insecure directories? [ny]」プロンプトを出す。zpty ベンチではこの read が
      # 事前投入コマンドの先頭 1 文字を回答として食い、残りが 'rint ...' (command not found) として
      # 実行され marker が永遠に返らない = first_command が 30s タイムアウトで恒常 fail する
      # (ローカルで group-writable fpath を作り機構ごと再現済み)。compaudit の指摘対象だけを正確に直す。
      # compaudit は指摘ありのとき非 0 終了する。既定の run シェルは pipefail 無しだが、将来
      # 明示 shell 指定 (bash は -eo pipefail になる) に変わっても壊れないよう || true で受ける
      - name: Fix zsh fpath permissions (compaudit)
        run: |
          { zsh -lc 'autoload -Uz compaudit; compaudit' || true; } | xargs -r sudo chmod g-w,o-w

      # zshenv→zshrc→zlogin の全ロードコスト (startup) と、対話シェルが入力を受け付けて
      # 最初のコマンドが返るまで (first_command、zpty 計測) をゲートする。
      # 詳細は tests/zshrc/bench_zsh.sh のヘッダ参照
      # baseline のサンプル台帳 (Step Summary 比較テーブルの before 側)。直前 1 run でなく
      # 直近数 run をプールして比較する (保持 run 数は bench_stats.sh の BASELINE_RUNS が出典)。
      # save は green run のみ (下の Save step の if) なので、赤 run が比較基準を汚さない
      - name: Restore previous bench stats
        uses: actions/cache/restore@v6
        with:
          path: .bench-prev
          key: bench-prev-zsh-${{ github.run_id }}
          restore-keys: bench-prev-zsh-

      - name: Bench zsh startup (budget check)
        env:
          BENCH_PREV_FILE: .bench-prev/zsh.tsv
          BENCH_STATS_OUT: .bench-prev/zsh.tsv
        run: mkdir -p .bench-prev && tests/run_bench.sh zsh tests/zshrc/bench_zsh.sh tests/zshrc/bench_budgets.ci

      - name: Save bench stats for next run
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .bench-prev
          key: bench-prev-zsh-${{ github.run_id }}

  bench-tmux:
    runs-on: ubuntu-slim
    timeout-minutes: 20  # BENCH_RUNS=20: 1 run ~20-30s 実測
    steps:
      - uses: actions/checkout@v7

      # bench_tmux.sh は zsh スクリプト。計測対象の tmux も必要
      - name: Install runtime dependencies (tmux, zsh)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux zsh

      # ボトルネックになりがちな箇所 = conf ロード / status format 展開 /
      # hook (debounced_save, mark-seen) 込みの window 操作を計測する。display -p 系は
      # クライアント fork+往復 (tmux_rtt) が支配的なので、format 自体のコストは
      # status_render - tmux_rtt の差分で読む。
      # baseline のサンプル台帳 (Step Summary 比較テーブルの before 側)。直前 1 run でなく
      # 直近数 run をプールして比較する (保持 run 数は bench_stats.sh の BASELINE_RUNS が出典)。
      # save は green run のみ (下の Save step の if) なので、赤 run が比較基準を汚さない
      - name: Restore previous bench stats
        uses: actions/cache/restore@v6
        with:
          path: .bench-prev
          key: bench-prev-tmux-${{ github.run_id }}
          restore-keys: bench-prev-tmux-

      - name: Bench tmux latency (budget check)
        env:
          BENCH_PREV_FILE: .bench-prev/tmux.tsv
          BENCH_STATS_OUT: .bench-prev/tmux.tsv
        run: mkdir -p .bench-prev && tests/run_bench.sh tmux tests/tmux/bench_tmux.sh tests/tmux/bench_budgets.ci

      - name: Save bench stats for next run
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .bench-prev
          key: bench-prev-tmux-${{ github.run_id }}

  bench-glogx:
    runs-on: ubuntu-slim
    timeout-minutes: 15  # BENCH_RUNS=20: build 1 回 + 1 run 数秒
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/glogx/go.mod
          cache-dependency-path: src/glogx/go.sum

      # 描画ホットパス (View 1 フレーム / job パネル込み View / 大 patch の一括整形) の
      # 回帰ゲート。chroma のハイライトは共有 runner で桁膨れした flake 実績があり対象外
      # (bench_glogx.sh のヘッダ参照)。予算は導入時ローカル実測ベースの緩い上限で、
      # CI 実測が Step Summary に溜まったら締める (bench_budgets.ci 参照)
      # baseline のサンプル台帳 (Step Summary 比較テーブルの before 側)。直前 1 run でなく
      # 直近数 run をプールして比較する (保持 run 数は bench_stats.sh の BASELINE_RUNS が出典)。
      # save は green run のみ (下の Save step の if) なので、赤 run が比較基準を汚さない
      - name: Restore previous bench stats
        uses: actions/cache/restore@v6
        with:
          path: .bench-prev
          key: bench-prev-glogx-${{ github.run_id }}
          restore-keys: bench-prev-glogx-

      - name: Bench glogx render hot paths (budget check)
        env:
          BENCH_PREV_FILE: .bench-prev/glogx.tsv
          BENCH_STATS_OUT: .bench-prev/glogx.tsv
        run: mkdir -p .bench-prev && tests/run_bench.sh glogx tests/glogx/bench_glogx.sh tests/glogx/bench_budgets.ci

      - name: Save bench stats for next run
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .bench-prev
          key: bench-prev-glogx-${{ github.run_id }}
