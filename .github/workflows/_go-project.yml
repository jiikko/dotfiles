---
# src/<project> の Go lint + test を実行する再利用 workflow (workflow_call)。
# glogx / disassemble_excel などの CI 本体が
# 「プロジェクト dir だけ違う」完全同型だったのを一元化。各プロジェクトは
# paths filter だけ持つ薄い caller (src_<project>.yml) から dir を渡して呼ぶ。
# 新しい Go プロジェクトを src/ に足したら caller を 1 本足すだけ
# (root Makefile の GO_PROJECT_DIRS コメント参照)。ファイル名の先頭 _ は
# 「top-level トリガを持たない再利用専用」であることの目印。
#
# 🚨 caller の paths filter 付き check を branch protection の required check に
#   登録しないこと: 非接触 PR では run 自体が生成されず、check が永遠に pending で
#   マージ不能になる (どうしても required にしたければ paths-ignore の no-op twin が必要)。
name: go-project

on:
  workflow_call:
    inputs:
      dir:
        description: 対象プロジェクトの相対パス (例 src/glogx)
        required: true
        type: string

permissions:
  contents: read

# actions/checkout の git init が出す "Using 'master'..." hint を抑制する。
# init.defaultBranch を git 実行時 config (GIT_CONFIG_*) で注入し、checkout の git init と
# テストの fake-repo git init (glogx 等) の両方に効かせる。専用の run: ステップにしないのは、
# ローカル composite action は checkout 後でないと解決できず「checkout 前」に一元化できない
# ため (env なら全 job / step へ自動継承される)。tests / lint / bench / karabiner も同方式。
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # 🚨 cgo を明示的に有効にする。`//go:build darwin && cgo` のファイル (src/glogx の
  # ime_tis_darwin.go) は **CGO_ENABLED=0 だと IgnoredGoFiles に落ちて黙って除外される**
  # (実測 2026-08-29: CGO=1 で CgoFiles に入り、CGO=0 で IgnoredGoFiles 行き)。
  # 既定値は「C コンパイラがあれば 1」なので、runner image の中身に依存する。
  # `-race` は cgo を要求しない (実測: CGO_ENABLED=0 go test -race が通る) ため、
  # ここを明示しないと「darwin 固有コードが 1 行もコンパイルされないまま緑」が成立する。
  CGO_ENABLED: "1"

jobs:
  # lint と test は独立 job: 並列実行 + 片方だけの再実行が可能
  lint:
    # 対象は macOS のみ (issue 133)。Linux はサポート対象外なので CI もそちらへ揃える。
    # 🚨 `macos-latest` にしない (ラベルの移動で環境が黙って変わる)。開発機が darwin24 = macOS 15。
    runs-on: macos-15
    # make lint は golangci-lint を scripts/golangci_lint.sh がソースからビルドする (runner では毎回初回)。build cache が warm
    # なら ~3-5 分だが、cold だと 15 分を超えることがある (ubuntu-slim で実測。macOS runner は
    # さらに遅い可能性があるので、移行後に実測して詰めること)。timeout でジョブが
    # cancel されると post-step の cache-save が走らず、次回も cold → また cancel、の悪循環になる
    # (実測: a43cbe8 / 40b2600 で連続 cancel)。cold compile を完走させ build cache を populate
    # できるだけの余裕を持たせる (以降は cache 復元で速い)。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      # scripts/golangci_lint.sh がビルドした golangci-lint を run をまたいで残す。残さないと lint の job は毎回
      # 依存のダウンロードとビルドからやり直す。setup-go のキャッシュは鍵 (go.sum のハッシュ) が一致すると保存し直さず、
      # 同じ鍵の test の job が先に保存した中身 (golangci-lint を含まない) を使い回すので、そちらでは補えない
      # (2026-10-01 の src/glogx の lint で `Cache hit` の後に `go: downloading` が 204 行。手元で空からのビルドは 23 秒)。
      # 鍵の要素は置き場の鍵 (golangci_lint.sh の dir 名) と同じ。版が変われば別の鍵になり、古い物は使われない
      - name: Key for the golangci-lint cache
        id: gl
        env:
          GO_VERSION: ${{ steps.go.outputs.go-version }}
          SCRIPT_HASH: ${{ hashFiles('scripts/golangci_lint.sh') }}
        run: |
          v=$(sed -n 's/^GOLANGCI_LINT_VERSION[[:space:]]*:=[[:space:]]*//p' ${{ inputs.dir }}/Makefile)
          [ -n "$v" ] || { echo "::error::${{ inputs.dir }}/Makefile から GOLANGCI_LINT_VERSION を読めない"; exit 1; }
          echo "key=golangci-lint-$v-go$GO_VERSION-$RUNNER_OS-$RUNNER_ARCH-$SCRIPT_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/dotfiles-go-tools
          key: ${{ steps.gl.outputs.key }}

      - name: Lint
        run: make -C ${{ inputs.dir }} lint

  test:
    # 対象は macOS のみ (issue 133)。lint と同じ理由で pin する。
    runs-on: macos-15
    # macOS runner は VM 起動が遅い。ubuntu 時代の 10 分では足りない可能性があるので広げる
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum

      - name: Test
        run: make -C ${{ inputs.dir }} test
