---
# src/lockman (ディレクトリ単位の排他 CLI) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。paths に _go-project.yml を含めるのは、共有本体を編集したとき
# にも全プロジェクトの CI を走らせて検証するため (含めないと本体変更が誰にも検証されない)。
# ⚠️ paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
#
# ⚠️ lockman の対象環境は macOS (smbfs + macOS のファイル共有) だが、ここで回るのは
#   ローカル FS のテストだけ (runner は macOS。issue 133 で ubuntu から移した)。SMB 由来の前提 (キャッシュ・mtime の打刻・
#   fcntl ロックの転送) は CI では一切検証されない。実機検証は human issue で人が行う。
#   darwin 固有コード (IOPlatformUUID / kern.boottime 等) を入れたら、そのとき
#   src_glogx.yml の darwin-build job に倣って macOS runner のビルド確認を足すこと。
name: src/lockman

on:
  push:
    branches: [master]
    paths:
      - 'src/lockman/**'
      - .github/workflows/src_lockman.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/lockman/**'
      - .github/workflows/src_lockman.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  lockman:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/lockman
