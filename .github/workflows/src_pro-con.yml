---
# src/pro-con (PM / PG 分離の TUI。issue 415) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。
# 🚨 paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/pro-con

on:
  push:
    branches: [master]
    paths:
      - 'src/pro-con/**'
      - 'src/tuikit/**'  # replace で取り込む共有 module (演出の部品 anim・markdown の整形器)
      - 'src/termsafe/**'  # replace で取り込む共有 module (コピーする本文の無害化)
      - 'src/procsup/**'  # replace で取り込む共有 module (supervisor・見張りの起こし直し。issue 506)
      - 'src/glogx/**'  # replace で取り込む (issue の読み方 glogx/issues)
      - 'src/doctor/**'  # glogx の依存 (replace は依存先から引き継がれないので pro-con にも要る)
      - 'tests/pro-con/**'  # e2e の通し (下の e2e job)
      - bin/pro-con
      - bin/lib/go_autobuild.zsh
      - .github/workflows/src_pro-con.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/pro-con/**'
      - 'src/tuikit/**'  # replace で取り込む共有 module (演出の部品 anim・markdown の整形器)
      - 'src/termsafe/**'  # replace で取り込む共有 module (コピーする本文の無害化)
      - 'src/procsup/**'  # replace で取り込む共有 module (supervisor・見張りの起こし直し。issue 506)
      - 'src/glogx/**'  # replace で取り込む (issue の読み方 glogx/issues)
      - 'src/doctor/**'  # glogx の依存 (replace は依存先から引き継がれないので pro-con にも要る)
      - 'tests/pro-con/**'  # e2e の通し (下の e2e job)
      - bin/pro-con
      - bin/lib/go_autobuild.zsh
      - .github/workflows/src_pro-con.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。
  pro-con:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/pro-con

  # tests/pro-con/ の e2e の通し。tests.yml の rest の腕には go が無く、そこでは skip (77) になるので、
  # go と tmux を揃えたここで走らせる。🚨 ここでは 77 も失敗と数える (skip で緑にすると CI のどこでも走らない)
  e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/pro-con/go.mod
          cache-dependency-path: src/pro-con/go.sum

      - uses: ./.github/actions/ensure-toolchain
        with:
          commands: tmux jq zsh

      - name: e2e
        run: |
          n=0
          # e2e_*.sh は 1 分以上かかるので make test の自動収集から外した分 (tests/pro-con/README.md)。ここでは両方走らせる
          for t in tests/pro-con/test_*.sh tests/pro-con/e2e_*.sh; do
            rc=0; bash "$t" || rc=$?
            if [ "$rc" -ne 0 ]; then echo "::error::[FAIL] $t (rc=$rc。77 = skip もここでは失敗)"; exit 1; fi
            echo "[ok] $t"; n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::tests/pro-con/ にテストが 1 件も無い"; exit 1; }
