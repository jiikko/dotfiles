---
# src/schedkeys (tmux 予約入力ウィザードの TUI) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。paths に _go-project.yml を含めるのは、共有本体を編集したとき
# にも全プロジェクトの CI を走らせて検証するため (含めないと本体変更が誰にも検証されない)。
# ⚠️ paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
#
# ⚠️ ここで回るのは ubuntu 上の unit テストだけ。実際の使われ方 (tmux popup の中で /dev/tty を
#   開き、IME の未確定文字が本物のカーソル位置に出るか) は tty 必須で CI では検証されない。
#   そこは human issue (issues/125) で人が確認する。
name: src/schedkeys

on:
  push:
    branches: [master]
    paths:
      - 'src/schedkeys/**'
      - .github/workflows/src_schedkeys.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/schedkeys/**'
      - .github/workflows/src_schedkeys.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  schedkeys:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/schedkeys

  # darwin での確認。この UI が実際に動くのは macOS の tmux popup だけで、ubuntu 側は
  # 「ロジックが正しいか」しか見ていない。ここでは同じ unit テストを darwin で走らせ、
  # 端末幅の計算 (ansi.StringWidth) や rune 処理が platform 差で崩れないことを守る。
  # ⚠️ 実際の見え方 (popup の中の描画・IME の未確定文字の位置) はここでも検証できない。
  #   tty と実 tmux が要るため、そこは human issue (issues/125) で人が確認する。
  darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/schedkeys/go.mod
          cache-dependency-path: src/schedkeys/go.sum

      - name: Build & test (darwin)
        working-directory: src/schedkeys
        run: |
          go build ./...
          go test -race ./...
