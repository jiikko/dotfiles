---
# 一時 workflow: fastDispWidth の arm64 アセンブリ版を Apple Silicon の runner で測る。
# 結果を読んだら削除する (このブランチの push でだけ起動する)。
name: tmp-bench-fastdispwidth

on:
  push:
    branches: ['claude/glogx-fastdispwidth-asm-*']

permissions:
  contents: read

jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/glogx/go.mod
          cache-dependency-path: src/glogx/go.sum

      - name: Machine
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string hw.ncpu
          go version

      - name: Unit tests (arm64, asm path)
        run: go test -count=1 ./termwidth/
        working-directory: src/tuikit

      - name: Micro bench (generic vs asm, same binary)
        working-directory: src/tuikit
        run: |
          go test -run '^$' -bench BenchmarkFastDispWidth -benchmem -count 10 ./termwidth/ | tee /tmp/micro.txt

      - name: glogx frame bench (base master vs this branch, interleaved)
        run: |
          base=$(git merge-base HEAD origin/master)
          git worktree add /tmp/base "$base"
          benches='^(BenchmarkViewSteady|BenchmarkViewSteadyJA|BenchmarkViewWithPanel|BenchmarkStatusViewFrame|BenchmarkIssuesViewFrame|BenchmarkRenderLinesLargePatch)$'
          (cd /tmp/base/src/glogx && go test -c -o /tmp/glogx_base.test .)
          (cd src/glogx && go test -c -o /tmp/glogx_new.test .)
          for i in 1 2 3 4 5 6 7 8; do
            (cd /tmp/base/src/glogx && /tmp/glogx_base.test -test.run '^$' -test.bench "$benches" -test.benchmem -test.count 1) >> /tmp/base.txt
            (cd src/glogx && /tmp/glogx_new.test -test.run '^$' -test.bench "$benches" -test.benchmem -test.count 1) >> /tmp/new.txt
          done

      - name: benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          {
            echo '## micro: generic vs asm'
            echo '```'
            benchstat -col /impl /tmp/micro.txt
            echo '```'
            echo '## glogx frame: base vs new'
            echo '```'
            benchstat base=/tmp/base.txt new=/tmp/new.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
