---
name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:  # GitHub UI からの手動再実行 (flake 切り分け用)

permissions:
  contents: read

# git init の hint 抑制 (init.defaultBranch)。env で注入する理由は _go-project.yml 参照。
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotfiles-lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install lint dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # ruby は test-ruby-syntax (Brewfile/_pryrc の ruby -c と _gemrc の YAML パース) 用
          # apt からは shellcheck を入れない (下でバージョン固定して導入する)
          sudo apt-get install -y --no-install-recommends zsh yamllint jq ruby

      # 静的解析の shellcheck はバージョンを固定してリリースバイナリで入れる。
      # apt (ubuntu 24.04) は 0.9 系で、開発機 (brew = 0.11) と指摘が食い違い「手元 green なのに
      # CI 赤」を生む (実例 2026-07-25: `[ -n "$x" ] && y || true` が 0.9 では SC2015、0.11 では無指摘)。
      # ⚠️ 手元の brew shellcheck を上げたらここも同じ版へ更新すること (差が戻ると同じ罠が再発する)。
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/shellcheck" --version

      # actionlint は apt に無いため公式リリースバイナリを取得する (test-actionlint が使う。
      # shellcheck が PATH にあると run: ブロックのシェル検査も有効になる)。
      # ⚠️ バージョンは固定する。latest 追従だと上流が検査を追加/厳格化した日に、手元では通るのに
      # CI だけ赤くなる (shellcheck で実際に起きた食い違いと同型。上の pin のコメント参照)。
      # 固定したので gh api による version 解決 (HTML エラーページ対策の 3 回リトライと空 ver
      # ガード) も不要になった。API 依存が消えた分、レート制限や障害でも落ちない。
      # ⚠️ 手元の actionlint を上げたらここも同じ版へ更新すること (差が戻ると同じ罠が再発する)。
      # tag は v 付き / 配布ファイル名は v なしなので、変数は v なしで持ち URL 側で付ける。
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          # ⚠️ --version を出すだけでは pin の証拠にならない。値を突き合わせる
          # (取得したバイナリが別版だった / PATH 解決が効いていない、を同時に捕まえる)。
          got=$("$RUNNER_TEMP/actionlint/actionlint" --version | head -1)
          [ "$got" = "$ACTIONLINT_VERSION" ] \
            || { echo "::error::actionlint の版が pin と違う (取得=$got 期待=$ACTIONLINT_VERSION)"; exit 1; }

      - name: Run lint suite
        run: make test-lint

# Go プロジェクト (src/*) の lint / test は、ここではなく再利用 workflow _go-project.yml を
# 呼ぶ paths filter 付きの caller (src_<project>.yml) で回す。全 push で走る lint.yml に置くと
# 非接触の push でも毎回実行されるため分離した (2026-07-17)。新しい Go プロジェクトを src/ に
# 足したら src_<project>.yml (caller) を 1 本作ること (root Makefile の GO_PROJECT_DIRS コメント参照)。
