---
# src/zundamon-kaisetsu (VOICEVOX の掛け合い動画を作る Go 製ツール。bin/zundamon-kaisetsu) の CI。lint + test の本体は
# 再利用 workflow _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の指定だけを持つ薄い caller。
# テストは skill のテンプレート (_claude/skills/zundamon-kaisetsu/templates/player.html) を読むので、skill の変更でも走らせる。
# 🚨 paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/zundamon-kaisetsu

on:
  push:
    branches: [master]
    paths:
      - 'src/zundamon-kaisetsu/**'
      - '_claude/skills/zundamon-kaisetsu/**'
      - .github/workflows/src_zundamon-kaisetsu.yml
      - .github/workflows/_go-project.yml
      - scripts/golangci_lint.sh   # 全プロジェクトの make lint が通る共有の入口
  pull_request:
    paths:
      - 'src/zundamon-kaisetsu/**'
      - '_claude/skills/zundamon-kaisetsu/**'
      - .github/workflows/src_zundamon-kaisetsu.yml
      - .github/workflows/_go-project.yml
      - scripts/golangci_lint.sh   # 全プロジェクトの make lint が通る共有の入口
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  zundamon-kaisetsu:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/zundamon-kaisetsu
