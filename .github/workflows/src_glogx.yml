---
# src/glogx (glog の push 機能つき派生版) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。paths に _go-project.yml を含めるのは、共有本体を編集したとき
# にも全プロジェクトの CI を走らせて検証するため (含めないと本体変更が誰にも検証されない)。
# ⚠️ paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/glogx

on:
  push:
    branches: [master]
    paths:
      - 'src/glogx/**'
      - .github/workflows/src_glogx.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/glogx/**'
      - .github/workflows/src_glogx.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  glogx:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/glogx

  # darwin ビルド確認。⚠️ **この job は冗長になった可能性がある** (2026-08-29)。
  # 元の理由は「lint/test が ubuntu で走るので ime_tis_darwin.go (darwin && cgo) が一度も
  # コンパイルされない」だったが、issue 133 で lint/test も macOS へ移したため、そちらでも
  # コンパイルされるようになった (実測: CGO_ENABLED=1 go build ./... が通り、go test も同条件)。
  # ただし「冗長だから外す」は _claude/rules/list-masked-failure-modes-before-removing-guard.md の
  # 対象で、外す前に「副次的に何を守っていたか」の列挙が要る (例: test が早期に失敗した回でも
  # ビルドだけは通ることを保証していた)。移行後の CI を観測してから判断する。issue 133 手順 4。
  darwin-build:
    runs-on: macos-15  # pin する (issue 133。latest はラベルの移動で黙って版が変わる)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/glogx/go.mod
          cache-dependency-path: src/glogx/go.sum

      - name: Build (darwin, cgo)
        working-directory: src/glogx
        env:
          CGO_ENABLED: "1"
        run: go build ./...
