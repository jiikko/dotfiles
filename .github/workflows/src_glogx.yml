---
# src/glogx (glog の push 機能つき派生版) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。paths に _go-project.yml を含めるのは、共有本体を編集したとき
# にも全プロジェクトの CI を走らせて検証するため (含めないと本体変更が誰にも検証されない)。
# ⚠️ paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/glogx

on:
  push:
    branches: [master]
    paths:
      - 'src/glogx/**'
      - .github/workflows/src_glogx.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/glogx/**'
      - .github/workflows/src_glogx.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  glogx:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/glogx

  # darwin ビルド確認。ime_tis_darwin.go は `darwin && cgo` + Carbon framework 依存で、
  # ubuntu の lint/test では一度もコンパイルされない (build tag で除外)。cgo なので
  # ubuntu からのクロスコンパイルでも検証できず、macOS runner での実ビルドが唯一の
  # 検証手段 (public repo のため macOS runner も無課金)。test は走らせない — ロジックの
  # 検証は ubuntu 側の -race テストが担い、ここは「darwin でコンパイルが通る」だけを守る
  darwin-build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/glogx/go.mod
          cache-dependency-path: src/glogx/go.sum

      - name: Build (darwin, cgo)
        working-directory: src/glogx
        env:
          CGO_ENABLED: "1"
        run: go build ./...
