---
# src/codexevents (codex の JSONL の run を判定する CLI) の CI。lint + test の本体は再利用 workflow
# _go-project.yml に一元化し、ここは paths filter (触れた変更のときだけ起動) と対象 dir の
# 指定だけを持つ薄い caller。paths に _go-project.yml を含めるのは、共有本体を編集したとき
# にも全プロジェクトの CI を走らせて検証するため (含めないと本体変更が誰にも検証されない)。
# 🚨 paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/codexevents

on:
  push:
    branches: [master]
    paths:
      - 'src/codexevents/**'
      - bin/codex-run          # driver のテストが写して走らせる
      - bin/codex-fanout
      - bin/lib/uint.sh        # driver のテストが本物を写す (issue 775)
      - .github/workflows/src_codexevents.yml
      - .github/workflows/_go-project.yml
      - .github/go-version
      - scripts/golangci_lint.sh   # 全プロジェクトの make lint が通る共有の入口
      - src/.golangci.yml          # lint の設定の共通の塊 (golangci_lint.sh が差分と合成する)
      - scripts/golangci_config.rb # その合成
      - scripts/golangci_ruleguard_key.rb # ruleguard の規則の中身を設定の鍵に入れる
      - scripts/go_module_graph.sh   # 全プロジェクトの make lint が先に回す module グラフの検査 (issue 787)
  pull_request:
    paths:
      - 'src/codexevents/**'
      - bin/codex-run          # driver のテストが写して走らせる
      - bin/codex-fanout
      - bin/lib/uint.sh        # driver のテストが本物を写す (issue 775)
      - .github/workflows/src_codexevents.yml
      - .github/workflows/_go-project.yml
      - .github/go-version
      - scripts/golangci_lint.sh   # 全プロジェクトの make lint が通る共有の入口
      - src/.golangci.yml          # lint の設定の共通の塊 (golangci_lint.sh が差分と合成する)
      - scripts/golangci_config.rb # その合成
      - scripts/golangci_ruleguard_key.rb # ruleguard の規則の中身を設定の鍵に入れる
      - scripts/go_module_graph.sh   # 全プロジェクトの make lint が先に回す module グラフの検査 (issue 787)
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  codexevents:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/codexevents
