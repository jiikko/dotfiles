---
# src/dupscan (本体が同じ形のメソッドを構文木で見つける CLI。bin/dupscan) の CI。
# lint + test の本体は再利用 workflow _go-project.yml に一元化し、ここは paths filter
# (触れた変更のときだけ起動) と対象 dir の指定だけを持つ薄い caller。
# 🚨 paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
name: src/dupscan

on:
  push:
    branches: [master]
    paths:
      - 'src/dupscan/**'
      - 'src/subproc/**'     # replace で取り込む共有 module
      - .github/workflows/src_dupscan.yml
      - .github/workflows/_go-project.yml
      - scripts/golangci_lint.sh   # 全プロジェクトの make lint が通る共有の入口
      - src/.golangci.yml          # lint の設定の共通の塊 (golangci_lint.sh が差分と合成する)
      - scripts/golangci_config.rb # その合成
      - scripts/go_module_graph.sh # make lint が先に回す module グラフの検査
  pull_request:
    paths:
      - 'src/dupscan/**'
      - 'src/subproc/**'
      - .github/workflows/src_dupscan.yml
      - .github/workflows/_go-project.yml
      - scripts/golangci_lint.sh
      - src/.golangci.yml
      - scripts/golangci_config.rb
      - scripts/go_module_graph.sh
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (check 名が "<id> / lint" になる)。全 caller で同じだと区別できないのでプロジェクト名にする
  dupscan:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/dupscan
