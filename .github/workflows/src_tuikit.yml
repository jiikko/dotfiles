---
# src/tuikit (端末 UI の部品: 幅計算・演出の状態機械・画面合成。glogx が replace で取り込む共有 module) の CI。
# lint + test の本体は再利用 workflow _go-project.yml に一元化し、ここは paths filter
# (触れた変更のときだけ起動) と対象 dir の指定だけを持つ薄い caller。
# 🚨 paths filter 付きの check を required check に登録しない (理由は _go-project.yml 参照)。
#
# 🚨 ここを変えたら src_glogx.yml も走る (paths に src/tuikit/** を足してある)。幅計算と演出は
#   glogx の画面の土台なので、取り込む側のテストまで通す。
name: src/tuikit

on:
  push:
    branches: [master]
    paths:
      - 'src/tuikit/**'
      - 'src/termsafe/**'  # replace で取り込む共有 module (toast の通知文の無害化)
      - .github/workflows/src_tuikit.yml
      - .github/workflows/_go-project.yml
  pull_request:
    paths:
      - 'src/tuikit/**'
      - 'src/termsafe/**'  # replace で取り込む共有 module (toast の通知文の無害化)
      - .github/workflows/src_tuikit.yml
      - .github/workflows/_go-project.yml
  workflow_dispatch:  # GitHub UI からの手動再実行用

permissions:
  contents: read

# 同一 ref の連続 push では古い run を打ち切る (旧コミットの結果に価値が無いため)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job id はチェック名の識別子 (共有 workflow のため check 名が "<id> / lint" になり、全 caller で同一 id だと区別不能)。プロジェクト名にする。
  tuikit:
    uses: ./.github/workflows/_go-project.yml
    with:
      dir: src/tuikit
