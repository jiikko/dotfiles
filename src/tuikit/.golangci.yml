# golangci-lint v2 config for tuikit.
# 既定の linter (errcheck / govet / ineffassign / staticcheck / unused) に加えて、低ノイズの
# 衛生系と、lib の不変条件を機械で止める depguard / forbidigo を足す。
version: "2"

# root の Makefile (run_go_projects) が全プロジェクトを並列に回すため、ロック待ちで落ちない
# ようにする (理由の詳細は src/termsafe/.golangci.yml。issue 258)
run:
  allow-parallel-runners: true

linters:
  enable:
    - copyloopvar    # loop variables needlessly copied (Go 1.22+)
    - depguard       # lib の依存の不変条件 (下の rules)
    - dupl           # コピペ重複 (glogx から移した部品は glogx の lint が掛からなくなったので同じ網を張る)
    - durationcheck  # Duration 同士の乗算バグ (所要時間を引数で受ける API が多い)
    - exhaustive     # default なし switch の enum 網羅を強制 (anim.Phase を足したら全 switch が止まる)
    - forbidigo      # 幅モデルの 2 本目と、部品の中での時刻取得を禁止 (下の forbid)
    - intrange       # for i := 0; i < n; i++  ->  for i := range n
    - misspell       # common English misspellings in comments/strings
    - nolintlint     # 説明なし nolint コメントの禁止
    - perfsprint     # fmt.Sprintf that a faster stdlib call can replace
    - prealloc       # 事前確保できる append ループ (毎フレーム全行で走る合成の alloc 削減)
    - recvcheck      # value / pointer receiver の混在検出
    - unconvert      # redundant type conversions
    - unparam        # 常に同値の引数・未使用戻り値
    - usestdlibvars  # hand-written constants that exist in the stdlib
    - wastedassign   # assignments whose value is never read
  settings:
    dupl:
      threshold: 120
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        # 部品は描画フレームワークに依存しない (「[]string → []string」と壁時計の状態機械だけ)。
        # bubbletea に依存させると、v1 のままのアプリや別フレームワークから使えなくなる。
        # デモ (examples/) だけが bubbletea を使ってよい。
        no-framework-in-parts:
          files:
            - "**/anim/**"
            - "**/layout/**"
            - "**/listnav/**"
            - "**/sgr/**"
            - "**/termwidth/**"
            - "**/widthenv/**"
          deny:
            - pkg: charm.land/bubbletea
              desc: 部品はフレームワーク非依存 (tick は使う側が回す。README の「使う側の約束」)
            - pkg: github.com/charmbracelet/bubbletea
              desc: 部品はフレームワーク非依存 (tick は使う側が回す。README の「使う側の約束」)
        # 部品は「状態 → 文字列」の純粋な層。I/O・プロセス起動・非同期を持ち込むと、毎フレーム呼ばれる
        # 合成の性能とテスト容易性が壊れる (glogx の render.go に掛けていた render-pure と同じ)。
        # widthenv は環境変数を読むのが仕事なので対象外。
        parts-pure:
          files:
            - "**/anim/**"
            - "**/layout/**"
            - "**/listnav/**"
            - "**/sgr/**"
            - "**/termwidth/**"
            - "!**/*_test.go"
          deny:
            - pkg: os
              desc: 部品は純粋な層 (I/O 禁止)
            - pkg: os/exec
              desc: 部品は純粋な層 (プロセス起動禁止)
            - pkg: context
              desc: 部品は純粋な層 (非同期処理は使う側へ)
        # 幅計算の唯一の出典は termwidth.Of (= ansi.StringWidth)。runewidth は East Asian
        # ambiguous を locale 依存で 2 桁と数え、枠の計算が実行環境でずれる (glogx issue 027)。
        width-single-source:
          files:
            - "**/*.go"
          deny:
            - pkg: github.com/mattn/go-runewidth
              desc: 幅は termwidth.Of で測る (locale 非依存)
        # 分割も幅も x/ansi に一本化してある (termwidth.FirstCluster。glogx issue 124)。
        uniseg-test-only:
          files:
            - "**/*.go"
            - "!**/termwidth/width_fast_test.go"   # fast-path の受理集合をクラスタ数で総当たり検証する (幅は測らない)
          deny:
            - pkg: github.com/rivo/uniseg
              desc: 分割も幅も termwidth に一本化した (termwidth.FirstCluster / termwidth.Of)
    forbidigo:
      # 🚨 脅威モデル: うっかり書く典型の形 (time.Now() / ansi.StringWidthWc) を止める。**検出しない形**:
      #   import の別名 (`tm "time"` → tm.Now) / time.Until・time.Tick 等の別 API / 変数経由の呼び出し。
      #   analyze-types を使っていないので名前の字面でしか一致しない。意図的な迂回はレビューの責務
      forbid:
        # depguard はパッケージ単位でしか止められず、同じ x/ansi の 2 本目の幅モデルを止められない
        - pattern: ^ansi\.StringWidthWc$
          msg: 幅は termwidth.Of (GraphemeWidth) の 1 系統だけ (glogx issue 112 / 124)
        # 部品は時刻を引数 (now) で受け取る。中で取ると、使う側のテストが時刻を固定できない
        - pattern: ^time\.(Now|Since)$
          msg: 部品は時刻を引数で受け取る (使う側のテストで固定できるように)
  exclusions:
    rules:
      # テストのヘルパーは汎用の引数を持ってよい (glogx と同じ)
      - path: _test\.go
        linters:
          - unparam
      # デモは実時間で動かす本物のアプリ
      - path: examples/
        text: 部品は時刻を引数で受け取る
        linters:
          - forbidigo

# gofmt を CI ゲートにする (v2 では formatter は linters と別枠)
formatters:
  enable:
    - gofmt
