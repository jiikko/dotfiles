# tmpclean の golangci-lint の設定の差分。共通の塊は src/.golangci.yml で、scripts/golangci_lint.sh が run のたびに合成する。
linters:
  enable:
    - depguard       # 外部コマンドは internal/runner 経由 (下の rules)
    - forbidigo      # 出力先を引数で受けない裸の print を禁止
  settings:
    depguard:
      rules:
        exec-via-runner:
          # 外部コマンドは internal/runner に一本化する (stdout / stderr / rc を分けて返す・WaitDelay・プロセスグループ)。
          # 判定 (生きている claude・使用中のパス) が os/exec を直に叩くと、その規律の外でプロセスが起きる
          files:
            - "**/*.go"
            - "!**/internal/runner/*.go"
          deny:
            - pkg: os/exec
              desc: 外部コマンドは internal/runner 経由で起こす
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: 出力先を引数で受けること (Run は stdout / stderr を引数に取る)
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
