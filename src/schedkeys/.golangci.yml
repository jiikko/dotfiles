# golangci-lint v2 config for schedkeys.
# The standard linters (errcheck, govet, ineffassign, staticcheck, unused) are
# on by default; the extras below are low-noise, mostly auto-fixable hygiene
# linters. Run `golangci-lint run --fix ./...` to apply the auto-fixes.
version: "2"

# 🚨 golangci-lint は既定で os.TempDir()/golangci-lint.lock に flock を取り、別インスタンスが
# 走っていると 5 秒待って "parallel golangci-lint is running" で落ちる (v2.15.0 の
# pkg/commands/run.go acquireFileLock を実測)。この lock はキャッシュ保護ではない
# (キャッシュは Go の build cache の fork。内容アドレスなので競合する 2 プロセスは同一バイト列を
# 書く。書き込み自体は temp+rename ではなく最終名への直接 write で、安全性の根拠は原子性ではなく
# 内容アドレス) ので、外しても結果の正しさには影響しない。root の Makefile (run_go_projects) が 7 プロジェクトを並列に
# 回すため、全プロジェクトでこれを true にする (1 つでも false が残ると、その 1 つが他の
# 6 つの起動タイミング次第で落ちる)。
run:
  allow-parallel-runners: true

linters:
  enable:
    - copyloopvar    # loop variables needlessly copied (Go 1.22+)
    - forbidigo      # 幅・切り詰めの x/ansi 直呼びを禁止 (下の forbid)
    - intrange       # for i := 0; i < n; i++  ->  for i := range n
    - misspell       # common English misspellings in comments/strings
    - perfsprint     # fmt.Sprintf that a faster stdlib call can replace
    - unconvert      # redundant type conversions
    - usestdlibvars  # hand-written constants that exist in the stdlib
    - wastedassign   # assignments whose value is never read
    # バグを見つける系 (全モジュール共通の塊。golangci-lint の推奨構成から、この repo で誤検出が出ないものを選んだ)
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - durationcheck
    - errorlint
    - exptostd
    - gocheckcompilerdirectives
    - gochecksumtype
    - iotamixing
    - nilerr
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - reassign
    - tparallel
  settings:
    perfsprint:
      concat-loop: false # ループの中の文字列の連結を strings.Builder へ書き換えさせる。小さなループばかりで、読みやすさを崩すほど効かない
    govet:
      # 既定の analyzer に加えて全部を有効にする (nilness・unusedwrite・deepequalerrors などは既定では走らない)
      enable-all: true
      disable:
        - fieldalignment # 構造体のフィールドをメモリの詰め方の順に並べ替えさせる。数バイトのために読む順を崩す
        - shadow         # := での再宣言を全部拾う。意図した再宣言 (err の受け直し) が多く、ノイズに埋もれる
    nolintlint:
      require-explanation: true # //nolint には理由を書く
      require-specific: true    # 黙らせる linter を名指しする
    forbidigo:
      forbid:
        # 端末の幅・切り詰め・切り出しは github.com/jiikko/dotfiles/src/tuikit/termwidth を通す。速い道 (と、入れるなら arm64 の実装) を
        # 置く場所を termwidth の 1 か所にするため。字面で見るので、別名の import・変数経由の呼び出しは検出しない
        - pattern: ^ansi\.(StringWidth|Cut|Truncate|TruncateLeft)$
          msg: 幅は termwidth.Of、切り詰め・切り出しは termwidth.Truncate / Cut / Slice / SliceFrom / SplitAround を使う (issue 524)
        # 折り返しも x/ansi を直に呼ばない。Hardwrap / Wrap はキーキャップで幅を超える行を返し、Wrap は書記素も割る
        - pattern: ^ansi\.(Hardwrap|Wrap|Wordwrap)$
          msg: 折り返しは termwidth.Wrap / WordWrap を使う (x/ansi はキーキャップで幅を超える。issue 590)
    errcheck:
      # Best-effort writes to stderr/stdout and closing read handles.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close

  exclusions:
    rules:
      # テストは画面の出力を x/ansi で測って確かめてよい (測る側を termwidth にすると、測られる側と同じ実装で答え合わせになる)
      - path: _test\.go
        text: issue 524
        linters:
          - forbidigo

# gofmt を CI ゲートにする (v2 では formatter は linters と別枠。ここに無いと run が整形差分を見ない)
formatters:
  enable:
    - gofmt
