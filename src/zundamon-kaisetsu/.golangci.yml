# golangci-lint v2 config for zundamon-kaisetsu。既定セットに forbidigo (下の 2 つの規律) を足す。
version: "2"

# 🚨 golangci-lint は既定で os.TempDir()/golangci-lint.lock に flock を取り、別インスタンスが
# 走っていると 5 秒待って "parallel golangci-lint is running" で落ちる (v2.5.0 の
# pkg/commands/run.go acquireFileLock を実測)。この lock はキャッシュ保護ではない
# (キャッシュは Go の build cache の fork。内容アドレスなので競合する 2 プロセスは同一バイト列を
# 書く。書き込み自体は temp+rename ではなく最終名への直接 write で、安全性の根拠は原子性ではなく
# 内容アドレス) ので、外しても結果の正しさには影響しない。root の Makefile (run_go_projects) が 7 プロジェクトを並列に
# 回すため、全プロジェクトでこれを true にする (1 つでも false が残ると、その 1 つが他の
# 6 つの起動タイミング次第で落ちる)。issue 258
run:
  allow-parallel-runners: true

# gofmt を CI ゲートにする (v2 では formatter は linters と別枠。ここに無いと run が整形差分を見ない)
formatters:
  enable:
    - gofmt

linters:
  enable:
    - forbidigo
  settings:
    forbidigo:
      # 字面で見る (別名の import・変数経由の呼び出しは検出しない)。issue 661
      forbid:
        # 子孫を止めるのは proctree に寄せる。グループ宛ての kill では、puppeteer が別のグループで起こした Chrome に届かない (issue 649)。
        # main.go のシグナルでの死に直し (自分への kill) とテストは下の exclusions で許す
        - pattern: ^syscall\.Kill$
          msg: 子孫を止めるのは proctree.Target.Stop を使う (グループ宛ての kill では別のグループの子に届かない。issue 649)
        # この package のテストはパッケージ変数 (mp4 のテストが縮める videoSize など) を書き換えるので、並列にしない (issue 651)
        - pattern: \.Parallel$
          msg: この package のテストは並列にしない (videoSize などのパッケージ変数を書き換えるテストがある。issue 651)
    errcheck:
      # 端末 (env.Stdout / env.Stderr) への進捗・結果の書き込み。失敗しても打つ手が無く、
      # 失敗を返り値で扱うと全コマンドの経路が戻り値の確認で埋まる。ファイルへの書き込みは対象外 (os.WriteFile 等は確認している)
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # main.go はシグナルで自分が死に直す行 (自分への kill) だけを許す (ファイル全体を外すと、そこに足したグループ宛ての kill も通る)
      - path: (^|/)main\.go$
        source: syscall\.Kill\(os\.Getpid\(\)
        text: proctree
        linters:
          - forbidigo
      # テストは偽のプロセスの後始末に kill を使う
      - path: _test\.go$
        text: proctree
        linters:
          - forbidigo
