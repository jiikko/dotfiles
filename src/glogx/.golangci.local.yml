# glogx の golangci-lint の設定の差分。共通の塊は src/.golangci.yml で、scripts/golangci_lint.sh が run のたびに合成する。
linters:
  enable:
    - containedctx   # struct フィールドへの ctx 格納の検出 (ctx は関数引数で渡し、struct には cancel を持つ規律。issue 029 と同族)
    - contextcheck   # ctx の非伝播・context.Background の握り込み検出 (issue 029 の cancel 系の再発防止)
    - depguard       # アーキテクチャ不変条件: render.go は純粋描画層 (下の rules)
    - dupl           # コピペ重複の検出 (runLog の 4 行 ×2 コピペを見逃した反省。閾値は下)
    - errname        # sentinel error は Err 接頭辞・error 型は Error 接尾辞
    - exhaustive     # default なし switch の enum 網羅を強制 (settings 参照。網羅性の機械化)
    - fatcontext     # ループ内で context を積み重ねるパターンの検出
    - forbidigo      # stdout 直接出力の禁止 (下の forbid。main.go だけ除外)
    - gocritic       # unlambda / singleCaseSwitch 等の診断 (試走 2 件のみ = 低ノイズを確認済み)
    - makezero       # make([]T, n) への append で先頭にゼロ値が残るバグ
    - mirror         # bytes/strings の鏡写し API の取り違え (無駄な変換 alloc。perf 文化と一致)
    - prealloc       # 事前確保できる append ループの検出 (View/整形ホットパスの alloc 削減文化と一致)
    - recvcheck      # value / pointer receiver の混在検出
    - usetesting     # テストの os.Chdir/MkdirTemp 等を t.Chdir/t.TempDir へ (cleanup 漏れの構造的防止)
    - unparam        # 常に同値の引数・未使用戻り値 (テストは除外 = ヘルパーの汎用引数を許す)
  settings:
    dupl:
      threshold: 120
    unparam:
      # 🚨 既定 (false) では package main 以外の公開関数を検査しない。internal/ へ出した画面・土台は
      # main から呼ぶために公開名になるので、既定のままだと移設で未使用引数の検査から黙って外れる
      check-exported: true
    exhaustive:
      # default 付き switch は「残りは default で受ける」という意図表明なので網羅を要求しない。
      # default なし switch にだけ enum 全 case を要求する (この repo の「網羅は実装で強制する」
      # 文化の機械化。~/dotfiles の comment-no-restate-enforced ルールと同じ思想)
      default-signifies-exhaustive: true
    forbidigo:
      # 「TUI 層は stdout へ直接書かず tea.Msg 経由で描画する」(browseModel の状態機械 = tui.go と browse_*.go の不変条件)
      # を機械化する。stdout への出力は main.go の静的経路に限定 (exclusions で許可)。
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: stdout への直接出力は main.go に限定する (TUI 層は tea.Msg 経由で描画)
        # 状態機械 (tui.go と browse_*.go。issue 971 で tui.go から分けた) の時刻はテスト差し替え用シーム (internal/app の var TimeNow) 経由で取る規律。push 演出 6 箇所が
        # これを迂回して time.Now/Since を直呼びしていた退行 の再発防止。シーム定義
        # 自体 (var TimeNow = time.Now。internal/app/clock.go) は状態機械の外なので対象外。状態機械の外の
        # 正当な time.Now は下の exclusions (path-except) で許可する。
        - pattern: ^time\.(Now|Since)$
          msg: 状態機械 (tui.go / browse_*.go) の時刻は app.TimeNow シーム経由で取る (テストで固定するため。issue 038)
        # 折り返しは termwidth.Wrap / WordWrap を通す。x/ansi の Hardwrap / Wrap はキーキャップで幅を超える行を返し、
        # Wrap は書記素も割る。字面で見るので、別名の import・変数経由の呼び出しは検出しない
        - pattern: ^ansi\.(Hardwrap|Wrap|Wordwrap)$
          msg: 折り返しは termwidth.Wrap / WordWrap を使う (x/ansi はキーキャップで幅を超える。issue 590)
    depguard:
      rules:
        width-single-source:
          # 幅計算の唯一の出典は termwidth.Of (= ansi.StringWidth。main では term.DispWidth の別名)。runewidth は
          # East Asian ambiguous (罫線・ブロック・…) を locale 依存で 2 桁と数えるため、
          # 混在すると枠計算とテストのアサートが実行環境依存でずれる (LANG=ja_JP で
          # テスト 12 件が落ちていた)。production/テストとも import を禁止して構造的に防ぐ。
          files:
            - "**/*.go"
          deny:
            - pkg: github.com/mattn/go-runewidth
              desc: 幅は termwidth.Of (ansi.StringWidth) で測る (locale 非依存。main では term.DispWidth 別名)
        # uniseg は本体から一切使わない。**幅だけでなく分割も** x/ansi に一本化したため
        # (termwidth.FirstCluster)。「分割にだけ使う」として render.go /
        # issues/wrap.go を除外しない。除外すると、分割器が 2 本ある限り列不変条件は閉じない
        # (uniseg=Unicode 15 / x/ansi=16 の版差で 2-rune クラスタの走査に違反 744 件)。
        # import 別名を使った持ち込みもここで止まる。シンボル名の走査は
        # width_test.go:TestNoSecondWidthEngine が担当 (tuikit も走査範囲。own_sources_test.go)。両輪。
        # termwidth は tuikit へ移ったので、fast-path の総当たり検証 (width_fast_test.go) の除外は
        # tuikit/.golangci.local.yml が持つ。
        uniseg-split-only:
          files:
            - "**/*.go"
            - "!**/width_test.go"
            # width-probe は「端末がどの幅モデルと一致するか」を測る道具で、3 モデル
            # (ansi.StringWidth / ansi.StringWidthWc / uniseg.StringWidth) を並べるのが仕事。
            # 本体からは参照しない (README の tools/ の項)。
            - "!**/tools/width-probe/main.go"
          deny:
            - pkg: github.com/rivo/uniseg
              desc: 分割も幅も termwidth に一本化した (termwidth.FirstCluster / term.DispWidth)。uniseg は使わない (issue 124)
        test-support-only-in-tests:
          # doctortest / testenv はテストが共有する部品 (testing を import する)。本番のコードから import すると
          # テスト用の fake と testing が glogx のバイナリに入る
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/internal/doctorview/doctortest/*.go"
            - "!**/internal/testenv/*.go"
            - "!**/internal/gitdata/gitdatatest/*.go"
            - "!**/internal/issuesview/issuesviewtest/*.go"
            - "!**/internal/statusview/statusviewtest/*.go"
          deny:
            - pkg: glogx/internal/doctorview/doctortest
              desc: doctortest はテスト専用 (本番のコードから import しない)
            - pkg: glogx/internal/testenv
              desc: testenv はテスト専用 (本番のコードから import しない)
            - pkg: glogx/internal/gitdata/gitdatatest
              desc: gitdatatest はテスト専用 (本番のコードから import しない)
            - pkg: glogx/internal/issuesview/issuesviewtest
              desc: issuesviewtest はテスト専用 (本番のコードから import しない)
            - pkg: glogx/internal/statusview/statusviewtest
              desc: statusviewtest はテスト専用 (本番のコードから import しない)
        data-layer-no-ui:
          # データ層 (gitdata) とその module 内の依存 (gitexec / app / term) は画面の道具を import しない。gitdata を UI 抜きで
          # 使う呼び出し元が bubbletea・fsnotify を背負わず、画面の道具の 1 行の変更で gitdata から上が作り直されないため。
          # 見るのは直接の import だけ: gitdata が module 内の別の package を新しく import したら、その package もここへ足す
          files:
            - "**/internal/gitdata/*.go"
            - "**/internal/gitexec/*.go"
            - "**/internal/app/*.go"
            - "**/internal/term/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: charm.land/bubbletea/v2
              desc: データ層は bubbletea に依存しない (tea.Cmd を組むのは画面と main)
            - pkg: github.com/fsnotify/fsnotify
              desc: データ層は fsnotify に依存しない (見張りは internal/fswatch)
            - pkg: github.com/jiikko/dotfiles/src/tuikit/foreground
              desc: データ層は前景のプロセス起動に依存しない (internal/extcmd)
            - pkg: glogx/internal/extcmd
              desc: git の実行は internal/gitexec (extcmd はエディタ・ブラウザ・前景の起動口で、bubbletea を持つ)
            - pkg: glogx/internal/fswatch
              desc: データ層は見張り (bubbletea と fsnotify を持つ) に依存しない
        render-pure:
          # render.go は「状態 → 文字列」の純粋な描画層。I/O・プロセス起動・非同期を
          # 持ち込むと TUI (毎フレーム呼ばれる) の性能とテスト容易性が壊れる
          files:
            - "**/render.go"
          deny:
            - pkg: os
              desc: render.go は純粋描画層 (I/O 禁止)
            - pkg: os/exec
              desc: render.go は純粋描画層 (プロセス起動禁止)
            - pkg: context
              desc: render.go は純粋描画層 (非同期処理は browseModel の状態機械へ)
    gocritic:
      # ruleguard: 単一 checker では書けない構文パターンの不変条件 (ルール本文と理由は
      # ruleguard.rules.go が正本)。enabled-checks は既定の stable セットへの追加。
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: gorules/rules.go
    errcheck:
      # Best-effort operations whose error is conventionally ignored in a CLI:
      # writes to stderr/stdout, closing/removing temp files on error paths,
      # and restoring the cwd in tests.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Chdir
        - os.Remove
        - (*os.File).Close
  exclusions:
    rules:
      # テストの事前確保には性能上の意味が無い (小さな fixture を組むだけ)
      - path: _test\.go$
        linters:
          - prealloc
      # 空白連結の規律 (padViaPadSpaces) は production だけに掛ける。
      # 🚨 テストは期待値の組み立てに strings.Repeat が要る (frame_alloc_test.go は
      #   「PadSpaces ≡ strings.Repeat」の同値検証そのものを持っており、置換すると自己言及になる)。
      - path: _test\.go
        text: 空白の連結は
        linters:
          - gocritic
      # app.TimeNow シームの規律は状態機械 (tui.go と browse_*.go) だけのもの (他ファイルは素の time.Now でよい)
      - path-except: (tui|browse_[a-z]+)\.go
        text: TimeNow シーム経由
        linters:
          - forbidigo
      # main.go は静的出力の出口なので stdout 書き込みを許可
      - path: main\.go
        linters:
          - forbidigo
      # テストのテーブル/フローの相似は仕様 (dupl の対象にしない)
      - path: _test\.go
        linters:
          - dupl
          - forbidigo
          - unparam

issues:
  # 既定 (true) は 1 行 1 issue に重複除去するため、同一行に別 linter の指摘があると
  # ruleguard のカスタム不変条件 (padViaPadSpaces 等) が無言で隠れる (導入時の変異検証で
  # 実際に踏んだ: unused と同居した行で ruleguard の指摘が消えた)。せっかくの強制が
  # 別 linter の陰で false green になるのを防ぐため、行内の全指摘を出す。
  uniq-by-line: false

  # 既定 (3) は同じ文面の指摘を 4 件目から落とす。一括退行 (例: timeNow シームを 20 箇所
  # 戻す) のとき 3 件しか出ず、直しては再実行を繰り返すことになる (実測: 20 箇所の退行で
  # 報告 3 件 → max-same-issues:0 で 20 件)。
  # 🚨 これは false green ではない (除外は上限の**前**に適用されるので make lint は赤のまま
  # 落ちる。実験で確認済み)。直すのは報告の不完全さだけ。
  max-same-issues: 0
  max-issues-per-linter: 0
