# mac-lan-manager の golangci-lint の設定の差分。共通の塊は src/.golangci.yml で、scripts/golangci_lint.sh が run のたびに合成する。
linters:
  enable:
    - containedctx   # struct フィールドへの ctx 格納の検出 (ctx は関数引数で渡し、struct には cancel を持つ規律。issue 029 と同族)
    - contextcheck   # ctx の非伝播・context.Background の握り込み検出 (issue 029 の cancel 系の再発防止)
    - depguard       # 幅の計算と分割の出典を 1 つにする (下の rules)
    - dupl           # コピペ重複の検出 (runLog の 4 行 ×2 コピペを見逃した反省。閾値は下)
    - errname        # sentinel error は Err 接頭辞・error 型は Error 接尾辞
    - exhaustive     # default なし switch の enum 網羅を強制 (settings 参照。網羅性の機械化)
    - fatcontext     # ループ内で context を積み重ねるパターンの検出
    - forbidigo      # stdout 直接出力・ファイル操作の直呼びなどの禁止 (下の forbid。main.go は stdout と「今」だけ除外)
    - gocritic       # unlambda / singleCaseSwitch 等の診断 (試走 2 件のみ = 低ノイズを確認済み)
    - makezero       # make([]T, n) への append で先頭にゼロ値が残るバグ
    - mirror         # bytes/strings の鏡写し API の取り違え (無駄な変換 alloc。perf 文化と一致)
    - prealloc       # 事前確保できる append ループの検出 (View/整形ホットパスの alloc 削減文化と一致)
    - recvcheck      # value / pointer receiver の混在検出
    - usetesting     # テストの os.Chdir/MkdirTemp 等を t.Chdir/t.TempDir へ (cleanup 漏れの構造的防止)
    - unparam        # 常に同値の引数・未使用戻り値 (テストは除外 = ヘルパーの汎用引数を許す)
  settings:
    dupl:
      threshold: 120
    exhaustive:
      # default 付き switch は「残りは default で受ける」という意図表明なので網羅を要求しない。
      # default なし switch にだけ enum 全 case を要求する (この repo の「網羅は実装で強制する」
      # 文化の機械化。~/dotfiles の comment-no-restate-enforced ルールと同じ思想)
      default-signifies-exhaustive: true
    forbidigo:
      # 画面の部品は glogx の TUI 層からも呼ばれるので stdout へ直接書かない。stdout への出力は main.go に限定
      # (exclusions で許可)。
      forbid:
        # 折り返しも x/ansi を直に呼ばない。Hardwrap / Wrap はキーキャップで幅を超える行を返し、Wrap は書記素も割る
        - pattern: ^ansi\.(Hardwrap|Wrap|Wordwrap)$
          msg: 折り返しは termwidth.Wrap / WordWrap を使う (x/ansi はキーキャップで幅を超える。issue 590)
        - pattern: ^fmt\.Print(f|ln)?$
          msg: stdout への直接出力は main.go に限定する (TUI 層は tea.Msg 経由で描画)
        # 設定の書き込みは atomicfile.Write を通す (途中まで書けたファイルを残さない)。
        - pattern: ^os\.WriteFile$
          msg: ファイルの書き込みは atomicfile.Write を通す (temp + rename)
        # 「今」は注入する (テストで固定できるように)。直に呼ぶのは注入の既定値と main.go だけ
        # time.Since / Until も中で「今」を読む。import の別名 (tm.Now) は検出しない (意図的な迂回は脅威モデルの外)
        - pattern: ^time\.(Now|Since|Until)$
          msg: 「今」は Model.now / walker.now (注入) から取る。time.Now / Since / Until を直に呼ばない
        # ユーザーのファイルを動かす・消す・繋ぐ操作は safefs を通す (Guard を syscall の直前に通す規律。src/safefs/CLAUDE.md)。
        # 脅威モデルはうっかりの直呼び。検出しない形: import の別名・関数値・os/exec で mv / rm を起こす形 (review の担当)。
        # 自前の設定・履歴の置き場の MkdirAll / OpenFile は対象にしない。自前の一時ファイルを消すなら行に `//nolint:forbidigo // 理由` を書く
        - pattern: ^os\.(Rename|Remove|RemoveAll|Symlink|Link)$
          msg: ユーザーのファイルを動かす・消す操作は safefs を通す (src/safefs/CLAUDE.md)
        - pattern: ^(unix|syscall)\.(Unlink|Unlinkat|Rmdir|Rename|Renameat|Renameat2|RenamexNp|RenameatxNp)$
          msg: ユーザーのファイルを動かす・消す操作は safefs を通す (src/safefs/CLAUDE.md)
        - pattern: ^(unix|syscall)\.(Mkdir|Mkdirat|Symlink|Symlinkat|Link|Linkat)$
          msg: ユーザーのファイルを動かす・消す操作は safefs を通す (src/safefs/CLAUDE.md)
    depguard:
      rules:
        width-single-source:
          # 幅計算の唯一の出典は termwidth.Of (= ansi.StringWidth)。runewidth は
          # East Asian ambiguous (罫線・ブロック・…) を locale 依存で 2 桁と数えるため、
          # 混在すると枠計算とテストのアサートが実行環境依存でずれる (LANG=ja_JP で
          # テスト 12 件が落ちていた)。production/テストとも import を禁止して構造的に防ぐ。
          files:
            - "**/*.go"
          deny:
            - pkg: github.com/mattn/go-runewidth
              desc: 幅は termwidth.Of (ansi.StringWidth) で測る (locale 非依存)
        # uniseg は使わない。**幅だけでなく分割も** x/ansi (termwidth.FirstCluster) に一本化した。
        # 「分割にだけ使う」として除外を足さない。分割器が 2 本ある限り列の不変条件は閉じない
        # (uniseg=Unicode 15 / x/ansi=16 の版差で 2-rune クラスタの走査が食い違う)。import 別名を使った持ち込みもここで止まる
        uniseg-split-only:
          files:
            - "**/*.go"
          deny:
            - pkg: github.com/rivo/uniseg
              desc: 分割も幅も termwidth に一本化した (termwidth.FirstCluster / termwidth.Of)。uniseg は使わない (issue 124)
    errcheck:
      # Best-effort operations whose error is conventionally ignored in a CLI:
      # writes to stderr/stdout, closing/removing temp files on error paths,
      # and restoring the cwd in tests.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Chdir
        - os.Remove
        - (*os.File).Close
  exclusions:
    rules:
      # テストの事前確保には性能上の意味が無い (小さな fixture を組むだけ)
      - path: _test\.go$
        linters:
          - prealloc
      # main.go は静的出力の出口なので stdout 書き込みを許可。🚨 text で絞る: path だけで forbidigo ごと
      # 外すと、キャッシュを書く本人 (main.go) に os.WriteFile の禁止が効かない
      - path: ^main\.go$ # module の根の main.go だけ (main\.go だと domain.go なども外れる)
        text: (stdout への直接出力|「今」は)
        linters:
          - forbidigo
      # テストのテーブル/フローの相似は仕様 (dupl の対象にしない)
      - path: _test\.go
        linters:
          - dupl
          - forbidigo
          - unparam

issues:
  # 既定 (true) は 1 行 1 issue に重複除去するため、同一行に別 linter の指摘があると片方が無言で隠れる
  # (forbidigo / depguard の不変条件が unused などの陰に消える)。行内の全指摘を出す。
  uniq-by-line: false

  # 既定 (3) は同じ文面の指摘を 4 件目から落とす。一括退行 (例: timeNow シームを 20 箇所
  # 戻す) のとき 3 件しか出ず、直しては再実行を繰り返すことになる (実測: 20 箇所の退行で
  # 報告 3 件 → max-same-issues:0 で 20 件)。
  # 🚨 これは false green ではない (除外は上限の**前**に適用されるので make lint は赤のまま
  # 落ちる。実験で確認済み)。直すのは報告の不完全さだけ
  max-same-issues: 0
  max-issues-per-linter: 0
