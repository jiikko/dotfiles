# doctor の golangci-lint の設定の差分。共通の塊は src/.golangci.yml で、scripts/golangci_lint.sh が run のたびに合成する。
linters:
  enable:
    - containedctx   # struct フィールドへの ctx 格納の検出 (ctx は引数で渡す)
    - contextcheck   # ctx の非伝播・context.Background の握り込み検出
    - depguard       # 外部コマンドは runner 経由 (下の rules)
    - dupl           # コピペ重複の検出 (閾値は下。テストは除外)
    - errname        # sentinel error は Err 接頭辞・error 型は Error 接尾辞
    - exhaustive     # default なし switch の enum 網羅を強制 (settings 参照)
    - fatcontext     # ループ内で context を積み重ねるパターンの検出
    - forbidigo      # 出力先を引数で受けない裸の print を禁止 (下の forbid)
    - gocritic       # exitAfterDefer 等の診断 (既定の stable セット)
    - makezero       # make([]T, n) への append で先頭にゼロ値が残るバグ
    - mirror         # bytes/strings の鏡写し API の取り違え
    - prealloc       # 事前確保できる append ループの検出
    - recvcheck      # value / pointer receiver の混在検出
    - unparam        # 常に同値の引数・未使用戻り値
    - usetesting     # テストの os.MkdirTemp/Chdir 等を t.TempDir/t.Chdir へ
  settings:
    depguard:
      rules:
        exec-via-runner:
          # 外部コマンドの実行は runner に一本化する。ctx の伝播・WaitDelay・プロセスグループの
          # 扱い・「読み取り専用のコマンドか」の検査が runner 側に集まっており、判定ライブラリ
          # (disk / svc / brewledger) が os/exec を直に叩くとその規律の外でプロセスが起きる。
          # 🚨 テストは除外する: disk/scan_test.go が「duSize が du -sk と一致する」ことを
          # 実 du で確かめており、そこは実 exec が要る (runner を通すと検証したい対象が変わる)
          files:
            - "**/*.go"
            - "!**/runner/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: os/exec
              desc: 外部コマンドは runner.Runner 経由で起こす (ctx / WaitDelay / プロセスグループの規律)
    forbidigo:
      # 出力先は必ず引数で受ける。cmd/*/main.go の emit は (stdout, stderr) を引数に取り、
      # exit_test.go がそこへバッファを差して「終了コードと出力が両方の出力形式で揃う」ことを
      # 検証している。裸の fmt.Print* はその設計を迂回する。
      # 🚨 forbidigo のパターンは**呼び出し先の式**にしか当たらず引数では判別できないので、
      # `fmt.Fprintf(os.Stdout, ...)` は捕まえられない (判定ライブラリは fmt.Fprintf を
      # strings.Builder 向けに多用しているため、Fprint* 自体は禁止できない)。
      # そこまで機械で止めるなら ruleguard (glogx の gorules/ が前例) が要る
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: 出力先を引数で受けること (cmd の emit は stdout/stderr を引数に取る設計)
    dupl:
      threshold: 120
    exhaustive:
      # default 付き switch は「残りは default で受ける」という意図表明なので網羅を要求しない
      # (glogx の .golangci.local.yml と同じ設定。判定の出典を 2 つにしない)。
      # 🚨 したがって、網羅を守らせたい switch には default を書かず全 case を並べること。
      # disk/scan.go の scanEntry がその形 (Guard を前後 2 本の switch で分担しており、
      # どちらにも書き忘れると guard 無しで候補になる = fail-open)。
      default-signifies-exhaustive: true
  exclusions:
    rules:
      # テストの事前確保には性能上の意味が無い (小さな fixture を組むだけ)
      - path: _test\.go$
        linters:
          - prealloc
      # テストのテーブル/フローの相似は仕様 (glogx と同じ扱い)
      - path: _test\.go
        linters:
          - dupl

issues:
  # 同じ文面の指摘を 4 件目から落とす既定 (3) では、一括退行のときに直しては再実行を繰り返す
  # ことになる
  max-same-issues: 0
  max-issues-per-linter: 0
