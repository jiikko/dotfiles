# golangci-lint v2 config for pro-con.
# 既定の linter (errcheck / govet / ineffassign / staticcheck / unused) に、状態の enum の網羅・ctx と error の扱い・
# パッケージの依存の向き・衛生系を足す。src/glogx/.golangci.yml を下敷きに、pro-con の構成に意味のあるものだけを選んだ (issue 415)。
#
# 入れていないもの (glogx にはある):
#   - prealloc: pro-con のスライスはカード・PG の本数 (数十) の大きさで、事前確保で測れる差が出ない。導入時に 21 件出たが、
#     多くは条件つきの append (確保すると空振りが増える) で、alloc の実測の根拠が無いまま直すことになる。画面の描画で alloc が
#     問題になったら (実測してから) 入れる
#   - recvcheck: card.Card は値で持ち回る型 (store / ui がコピーを持つ) で、読むだけのメソッドは値、変える DropRun だけが pointer。
#     混在は意図どおりで、揃えると値のまま呼んでいる箇所が壊れる
#   - bodyclose: pro-con は HTTP を使わない
#   - gocritic の ruleguard: 構文の不変条件の規則をまだ持たない (glogx の gorules/ に当たるものが無い)
version: "2"

# 🚨 root の Makefile (run_go_projects) が全プロジェクトを並列に回すので、全プロジェクトで true にする
# (1 つでも false が残ると、その 1 つが他の起動タイミング次第で落ちる。理由の詳細は issue 258 と
# src/doctor/.golangci.yml のコメント)。tests/scripts/test_golangci_parallel_runners.sh が検査する
run:
  allow-parallel-runners: true

linters:
  enable:
    - asasalint      # []any を ...any にそのまま渡す誤り
    - bidichk        # 危険な Unicode 双方向制御文字 (PM / PG の文を画面に出すので、コピペ由来の混入対策)
    - containedctx   # struct フィールドへの ctx 格納 (ctx は関数引数で渡す。dispatcher の Shutdown は呼び出しごとに上限を切る)
    - contextcheck   # ctx の非伝播・context.Background の握り込み (終了の保証は ctx の取り消しでも止めるのを続ける設計なので、切れ目を見える形にする)
    - copyloopvar
    - depguard       # パッケージの依存の向き (下の rules)
    - dupl           # コピペ重複 (閾値は下)
    - durationcheck  # Duration 同士の乗算 (待ち・上限・猶予の計算が多い)
    - errname        # sentinel error は Err 接頭辞・error 型は Error 接尾辞
    - errorlint      # errors.Is / As を使わない比較・%w 漏れ (dispatcher は ErrRunning / ErrStopperDied を errors.Is で分岐する)
    - exhaustive     # card.State / WaitKind / Ending / OrderKind の switch に case を足し忘れない
    - exptostd       # x/exp で書いたものの stdlib 昇格済み検出
    - fatcontext     # ループ内で context を積み重ねる形
    - forbidigo      # stdout への直接出力を root の package (CLI の口) に限る (下の forbid)
    - gocritic       # 既定の stable セット
    - intrange
    - makezero       # make([]T, n) への append で先頭にゼロ値が残る
    - mirror         # bytes / strings の鏡写し API の取り違え
    - misspell
    - nilnesserr     # err != nil を確かめたのに別の nil error を返す
    - nolintlint     # 説明なし nolint の禁止
    - perfsprint     # fmt.Sprintf / Errorf を速い stdlib の呼び出しで置き換えられる箇所
    - unconvert
    - unparam        # 常に同じ値の引数・使われない戻り値 (テストは除外 = ヘルパーの汎用引数を許す)
    - usestdlibvars  # stdlib にある定数の手書き
    - usetesting     # テストの os.Chdir / os.Setenv 等を t.Chdir / t.Setenv へ (後始末漏れの構造的防止。MkdirTemp は下の settings)
    - wastedassign   # 読まれない代入
  settings:
    dupl:
      threshold: 120 # glogx と同じ。導入時 0 件
    exhaustive:
      # default 付き switch は「残りは default で受ける」という意図表明なので網羅を要求しない (glogx / doctor と同じ)
      default-signifies-exhaustive: true
    usetesting:
      # 🚨 os.MkdirTemp("/tmp", …) は外さない: Unix socket のパスには上限 (macOS で 104 バイト) があり、t.TempDir は macOS では
      # /var/folders/… の長いパスになる (wake/wake_test.go の shortDir / live/live_test.go の shortState の注記)。
      # t.TempDir へ直すと socket のテストが「長い置き場は一時ディレクトリへ逃がす」側に倒れ、狙った経路を踏まない
      os-mkdir-temp: false
    forbidigo:
      # 画面 (ui) は bubbletea の描画で端末を持つので、stdout へ直接書くと画面が崩れる。stdout への出力は root の package
      # (main / cardcmd / dispatchercmd / e2ecmd = CLI の口。io.Writer で受けて書く) に限る。導入時 0 件
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: stdout への直接出力はしない (CLI の口は io.Writer で受けて書く。画面は bubbletea の描画だけ)
    depguard:
      rules:
        card-pure:
          # card はカードの型と遷移の規則だけを持つ純粋な層 (store / dispatcher / ui が共有する)。I/O・プロセス・ctx と、
          # ほかの pro-con の package を持ち込むと、依存の根が循環し、遷移の単体テストが I/O を要するようになる
          files:
            - "**/card/*.go"
          deny:
            - pkg: os
              desc: card は純粋な層 (I/O は store / dispatcher へ)
            - pkg: os/exec
              desc: card は純粋な層 (プロセスの起動は dispatcher / agents へ)
            - pkg: context
              desc: card は純粋な層 (非同期は dispatcher / ui へ)
            - pkg: pro-con/
              desc: card はほかの pro-con の package に依存しない (依存の根)
        top-only-from-main:
          # ui (画面) と dispatcher (割り振り係) は最上位の 2 つで、組み立てるのは root の package (main) だけ。
          # 下の層 (store / live / agents / backend …) が import すると依存が逆向きになる
          files:
            - "**/*.go"
            - "!**/pro-con/*.go"
            - "!$test"
          deny:
            - pkg: pro-con/ui
              desc: ui を組み立てるのは root の package だけ (下の層から画面へ依存しない)
            - pkg: pro-con/dispatcher
              desc: dispatcher を組み立てるのは root の package だけ (下の層から割り振り係へ依存しない)
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # テストのテーブル / フローの相似は仕様。テストのヘルパーの汎用引数・fixture の変数名も対象にしない
      - path: _test\.go
        linters:
          - dupl
          - errname
          - unparam

issues:
  # 既定 (true) は 1 行 1 issue に重複除去するので、同じ行の別 linter の指摘が隠れる (glogx の注記と同じ)
  uniq-by-line: false
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
